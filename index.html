main { padding-bottom: var(--space-3xl); }

.note { margin-top: var(--space-md); padding: var(--space-sm) var(--space-md); background: var(--color-paper-2); border-left: var(--rule-bar) solid var(--color-accent); }

<script>
(async () => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const safe = (u) => (/^https:\/\//.test(u || "") ? u : ""); // scraped urls: https only
  const money = (n) => (n < 0 ? "-$" : "$") + Math.abs(Math.round(n)).toLocaleString("en-US");
  const yen = (n) => "¥" + Math.round(n).toLocaleString("en-US");
  const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const KEY = "buyee-profit-key";
  const picked = new Set(), open = new Set();
  let D;

  async function decrypt(enc, keyBytes) {
    const key = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["decrypt"]);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(enc.iv) }, key, bytes(enc.ct))));
  }

  function unlock(enc) {
    return new Promise(async (done) => {
      try { // the key saved on this device at the last unlock
        const saved = localStorage.getItem(KEY);
        if (saved) return done(await decrypt(enc, bytes(saved)));
      } catch { /* wrong or missing key: ask */ }
      $("#lots").hidden = true;
      $("#gate").hidden = false;
      $("#pass").focus();
      $("#gate").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = $("#gate button");
        btn.setAttribute("aria-busy", "true");
        try {
          const base = await crypto.subtle.importKey("raw", new TextEncoder().encode($("#pass").value), "PBKDF2", false, ["deriveBits"]);
          const key = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: bytes(enc.salt), iterations: enc.iter, hash: "SHA-256" }, base, 256));
          const data = await decrypt(enc, key);
          try { localStorage.setItem(KEY, btoa(String.fromCharCode(...key))); } catch { /* private window: ask again next time */ }
          $("#gate").hidden = true;
          $("#lots").hidden = false;
          done(data);
        } catch {
          $("#gate-help").textContent = "that passphrase didn't open it. try again.";
          $("#pass").focus();
        }
        btn.removeAttribute("aria-busy");
      });
    });
  }

  // the same sums as landed.py and profit.py; D.check holds python's answer for a sample
  function shipYen(m, g) {
    for (const [max, y] of m.table) if (g <= max) return y;
    const pts = [m.table.at(-1), ...m.spot];
    for (let i = 0; i + 1 < pts.length; i++) {
      const [g0, y0] = pts[i], [g1, y1] = pts[i + 1];
      if (g <= g1) return y0 + ((y1 - y0) * (g - g0)) / (g1 - g0);
    }
    const [[g0, y0], [g1, y1]] = pts.slice(-2);
    return y1 + ((y1 - y0) * (g - g1)) / (g1 - g0);
  }
  function boxYen(group, method) {
    const m = D.haul.methods[method], kinds = group.map((r) => D.haul.kinds[r.kind]);
    const litres = kinds.reduce((a, k) => a + k.l, 0) * 1.25;
    const grams = kinds.reduce((a, k) => a + k.g, 0) + (litres <= 4 ? 50 : 300);
    return shipYen(m, Math.ceil(Math.max(grams, litres * 200) / 500) * 500) + m.clearance;
  }
  const landed = (r, group, method) =>
    (r.yen * (1 + D.haul.duty) + D.haul.fee + D.haul.kinds[r.kind].dom + boxYen(group, method) / group.length) / r.rate;
  const net = (usd) => usd * (1 - D.fee.rate - D.fee.processing) - D.fee.fixed;

  function left(end) {
    if (!end) return "not read yet";
    const m = Math.floor((new Date(end) - Date.now()) / 60000);
    if (m <= 0) return "ended";
    const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60);
    return d ? `${d}d ${h}h` : h ? `${h}h ${m % 60}m` : `${m}m`;
  }

  const judged = (r) => "grade" in r;
  const FILTERS = {
    all: ["all", () => true],
    worth: ["worth it", (r) => r.grade === "worth" || r.grade === "snipe"],
    snipe: ["snipe now", (r) => r.grade === "snipe"],
    outbid: ["outbid", (r) => r.status === "outbid"],
    winning: ["winning", (r) => r.status === "winning"],
  };
  const rank = (r) => ({ snipe: 0, worth: 1 })[r.grade] ?? 2;

  function figures(r, group) { // in the ticked haul when this row is ticked, else as the scan priced it
    if (!group.includes(r)) return r;
    const cost = landed(r, group, "ecms"), profit = net(r.market) - cost;
    return { ...r, landed: cost, profit, roi: profit / cost, inHaul: true };
  }

  function rowHtml(r0, group) {
    const r = figures(r0, group), id = esc(r.id), img = safe(r.image);
    const photo = img ? `<img src="${esc(img)}" alt="" width="64" height="64" loading="lazy" referrerpolicy="no-referrer">` : `<span class="blank"></span>`;
    const name = esc(r.title_en || r.title);
    const state = r.status === "watching" ? "" : `<span class="sub">${r.status}${r.your_bid ? `, your bid ${esc(r.your_bid.replace(" YEN", " yen"))}` : ""}</span>`;
    if (!judged(r)) {
      return `<tr><td class="pick"><label class="tick"><input type="checkbox" disabled><span class="visually-hidden">not read yet</span></label></td>
        <td class="photo">${photo}</td><td class="piece"><a href="${esc(safe(r.url))}" rel="noopener">${name}</a><span class="sub pending">not read yet. a few new pieces are read each scan.</span></td>
        <td class="num" data-label="ends in"><time data-end="${esc(r.end || "")}">${left(r.end)}</time></td><td class="num" data-label="price">${yen(r.yen)}</td>
        <td class="num pending" data-label="landed">pending</td><td class="num pending" data-label="market">pending</td><td class="num pending" data-label="profit">pending</td>
        <td class="num pending" data-label="return">pending</td><td class="num pending" data-label="max bid">pending</td><td class="state">${state}</td></tr>`;
    }
    const tag = r.grade === "snipe" ? `<span class="tag tag--snipe">snipe now</span>` : r.grade === "worth" ? `<span class="tag tag--worth">worth it</span>` : "";
    const max = r.max_bid ? yen(r.max_bid) + (r.max_bid < r.yen ? `<span class="sub">past it</span>` : "") : `<span class="pending">none</span>`;
    const comps = (r.comps || []).map((c) => `<li><a href="${esc(safe(c.url))}" rel="noopener">${esc(c.title)}</a>, ${money(c.usd)} on ${esc(c.source)}</li>`).join("");
    return `<tr>
      <td class="pick"><label class="tick"><input type="checkbox" name="haul" value="${id}"${picked.has(r.id) ? " checked" : ""}><span class="visually-hidden">add ${name} to the haul</span></label></td>
      <td class="photo">${photo}</td>
      <td class="piece"><button type="button" class="more" aria-expanded="${open.has(r.id)}" aria-controls="more-${id}">${name}</button><span class="sub">${esc(r.brand)}, ${esc(r.size || "size not listed")}</span></td>
      <td class="num" data-label="ends in"><time data-end="${esc(r.end)}">${left(r.end)}</time><span class="sub">${r.bids} bid${r.bids === 1 ? "" : "s"}</span></td>
      <td class="num" data-label="price">${yen(r.yen)}<span class="sub">${money(r.usd)}</span></td>
      <td class="num" data-label="landed">${money(r.landed)}<span class="sub">${r.inHaul ? "in this haul" : r.haul_n > 1 ? `in a haul of ${r.haul_n}` : "alone"}</span></td>
      <td class="num" data-label="market">${money(r.market)}<span class="sub">${r.conf === "estimate" ? "estimate" : `${r.comps_n} sales`}</span></td>
      <td class="num" data-label="profit">${money(r.profit)}</td>
      <td class="num" data-label="return">${Math.round(r.roi * 100)}%</td>
      <td class="num maxbid" data-label="max bid">${max}</td>
      <td class="state">${tag}${state}</td>
    </tr>
    <tr class="detail" id="more-${id}"${open.has(r.id) ? "" : " hidden"}><td colspan="11"><dl>
      <dt>listing</dt><dd><a href="${esc(safe(r.url))}" rel="noopener">open it on buyee</a></dd>
      <dt>condition</dt><dd>${esc(r.cond || "not stated")}</dd>
      <dt>fake check</dt><dd>${esc(r.fake)} risk. ${esc(r.fake_reason)}</dd>
      <dt>market price</dt><dd>${esc(r.basis)}</dd>
      <dt>landed cost</dt><dd>${money(r.landed_alone)} shipped alone by ecms, ${money(r0.landed)} with what you're winning now.</dd>
      <dt>sold comps</dt><dd>${comps ? `<ul>${comps}</ul>` : "none yet. the market price is claude's estimate from the photos."}</dd>
    </dl></td></tr>`;
  }

  function haulHtml(group) {
    const sell = group.reduce((a, r) => a + net(r.market), 0);
    const lines = Object.entries(D.haul.methods).map(([key, m]) => {
      const total = group.reduce((a, r) => a + landed(r, group, key), 0);
      return [total, `<tr><th scope="row">${esc(m.name)}</th><td>${money(total)}</td><td>${money(total / group.length)}</td><td>${money(sell - total)}</td><td>${Math.round(((sell - total) / total) * 100)}%</td></tr>`];
    }).sort((a, b) => a[0] - b[0]).map((x) => x[1]).join("");
    return `<div class="container haul__in"><div>
      <h2>haul of ${group.length}, selling for ${money(sell)} after fees</h2>
      <table><thead><tr><th scope="col">shipping</th><th scope="col">box total</th><th scope="col">a piece</th><th scope="col">profit</th><th scope="col">return</th></tr></thead><tbody>${lines}</tbody></table>
      <p>ticked rows above show their ecms share. at current prices, an auction can still climb.</p>
    </div><button type="button" class="btn btn--quiet" id="clear">clear the haul</button></div>`;
  }

  function view() {
    const f = FILTERS[location.hash.slice(1)] ? location.hash.slice(1) : "all";
    $("#tabs").innerHTML = Object.entries(FILTERS).map(([k, [label, test]]) =>
      `<a href="#${k}" aria-current="${k === f}">${label} <span class="count">${D.rows.filter(test).length}</span></a>`).join("");
    const group = D.rows.filter((r) => picked.has(r.id) && judged(r));
    const rows = D.rows.filter(FILTERS[f][1]).sort((a, b) => rank(a) - rank(b) || (a.end || "9").localeCompare(b.end || "9"));
    $("#lots").innerHTML = !D.rows.length
      ? `<p class="empty">nothing on your watch list or bids right now. add an auction to your buyee watch list and it shows up here at the next scan.</p>`
      : !rows.length ? `<p class="empty">no lots under this filter right now.</p>`
      : `<table class="lots"><thead><tr><th scope="col"><span class="visually-hidden">haul</span></th><th scope="col"><span class="visually-hidden">photo</span></th>
          <th scope="col">piece</th><th scope="col" class="num">ends in</th><th scope="col" class="num">price</th><th scope="col" class="num">landed</th>
          <th scope="col" class="num">market</th><th scope="col" class="num">profit</th><th scope="col" class="num">return</th><th scope="col" class="num">max bid</th>
          <th scope="col">status</th></tr></thead><tbody>${rows.map((r) => rowHtml(r, group)).join("")}</tbody></table>`;
    $("#haul").hidden = !group.length;
    $("#main").classList.toggle("has-haul", group.length > 0);
    $("#haul").innerHTML = group.length ? haulHtml(group) : "";
  }

  function clock() {
    document.querySelectorAll("time[data-end]").forEach((t) => { t.textContent = left(t.dataset.end); });
    const mins = Math.floor((Date.now() - new Date(D.at)) / 60000);
    $("#scan").textContent = `scanned ${mins < 1 ? "just now" : mins < 60 ? mins + " min ago" : Math.floor(mins / 60) + "h ago"}. bar: ${money(D.bar.profit_usd)} profit and ${Math.round(D.bar.roi * 100)}% return`;
    const notes = [];
    if (mins > 20) notes.push("this scan is old. the pc may be off or asleep, so prices and times here can be out of date.");
    if (!D.sold_on) notes.push("market prices are claude's estimates for now. real sold prices start once the apify token is in.");
    if (D.broken) notes.push("the haul sums on this page don't match the bot's. trust the row figures, not the haul bar.");
    $("#note").hidden = !notes.length;
    $("#note").textContent = notes.join(" ");
  }

  const raw = JSON.parse($("#data").textContent);
  D = raw.enc ? await unlock(raw.enc) : raw;
  const sample = D.check.ids.map((id) => D.rows.find((r) => r.id === id));
  D.broken = Object.entries(D.check.totals).some(([m, usd]) => Math.abs(sample.reduce((a, r) => a + landed(r, sample, m), 0) - usd) > 0.01);
  view();
  clock();
  setInterval(clock, 30000);
  addEventListener("hashchange", view);
  $("#lots").addEventListener("change", (e) => {
    if (e.target.name !== "haul") return;
    picked[e.target.checked ? "add" : "delete"](e.target.value);
    view();
    document.querySelector(`input[name="haul"][value="${CSS.escape(e.target.value)}"]`)?.focus(); // the table was redrawn
  });
  $("#lots").addEventListener("click", (e) => {
    const b = e.target.closest(".more");
    if (!b) return;
    const id = b.getAttribute("aria-controls").slice(5), row = document.getElementById(b.getAttribute("aria-controls"));
    open[open.has(id) ? "delete" : "add"](id);
    row.hidden = !open.has(id);
    b.setAttribute("aria-expanded", open.has(id));
  });
  $("#haul").addEventListener("click", (e) => {
    if (e.target.id !== "clear") return;
    picked.clear();
    view();
  });
})();

</script>
</body>
</html>
